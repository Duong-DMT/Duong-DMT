<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Đỗ Hồng Dương — DMT">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#0B1023"/>
      <stop offset="100%" stop-color="#070B19"/>
    </linearGradient>

    <linearGradient id="borderBling" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A855F7;#FDE047;#EC4899;#38BDF8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FDE047">
        <animate attributeName="stop-color" values="#FDE047;#EC4899;#38BDF8;#A855F7;#FDE047" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#38BDF8;#EC4899;#FDE047;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleShine" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FDE68A"/>
      <stop offset="82%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
      <animate attributeName="x1" values="-120%;100%" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20%;240%" dur="4.8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.26"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="sweepBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7DD3FC" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FDE047" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auroraLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="6" y="6" width="1188" height="308" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .tag { font: 600 12px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 3.6px; fill: #BAE6FD; }
    .name { font: 800 56px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 3px; }
    .sub { font: 500 19px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 2px; fill: #CBD5E1; }
    .meta { font: 600 13px 'Consolas', 'Courier New', monospace; letter-spacing: 1.4px; fill: #E2E8F0; }
    @keyframes twinkleA {
      0%, 100% { opacity: 0.15; transform: scale(0.55) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(18deg); }
    }
    @keyframes twinkleB {
      0%, 100% { opacity: 0.9; transform: scale(1.05) rotate(0deg); }
      50% { opacity: 0.18; transform: scale(0.5) rotate(-18deg); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .sA { transform-box: fill-box; transform-origin: center; animation: twinkleA 3.2s ease-in-out infinite; }
    .sB { transform-box: fill-box; transform-origin: center; animation: twinkleB 3.8s ease-in-out infinite; }
    .sC { transform-box: fill-box; transform-origin: center; animation: twinkleA 4.5s ease-in-out 1.1s infinite; }
    .sD { transform-box: fill-box; transform-origin: center; animation: twinkleB 2.9s ease-in-out 0.6s infinite; }
    .orbFloat { animation: floatSlow 6s ease-in-out infinite; }
  </style>

  <!-- Card Background & Clip -->
  <g clip-path="url(#cardClip)">
    <rect x="6" y="6" width="1188" height="308" fill="url(#bgGrad)"/>
    <rect x="6" y="6" width="1188" height="308" fill="url(#gridPattern)"/>

    <!-- Ambient Aurora Orbs -->
    <g class="orbFloat">
      <circle cx="220" cy="85" r="220" fill="url(#auroraLeft)"/>
      <circle cx="980" cy="95" r="230" fill="url(#auroraRight)"/>
      <circle cx="600" cy="170" r="200" fill="url(#auroraGold)"/>
    </g>

    <!-- Animated Silk Aurora Waves -->
    <path fill="url(#waveA)" d="M0,255 C260,210 420,295 660,250 C900,205 1040,285 1200,242 L1200,320 L0,320 Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0,255 C260,210 420,295 660,250 C900,205 1040,285 1200,242 L1200,320 L0,320 Z;
                M0,268 C240,295 450,215 680,260 C910,300 1050,215 1200,258 L1200,320 L0,320 Z;
                M0,255 C260,210 420,295 660,250 C900,205 1040,285 1200,242 L1200,320 L0,320 Z"/>
    </path>

    <path fill="url(#waveB)" d="M0,275 C220,305 460,235 720,275 C940,308 1080,245 1200,272 L1200,320 L0,320 Z">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
        values="M0,275 C220,305 460,235 720,275 C940,308 1080,245 1200,272 L1200,320 L0,320 Z;
                M0,262 C250,230 480,305 710,258 C940,220 1070,295 1200,260 L1200,320 L0,320 Z;
                M0,275 C220,305 460,235 720,275 C940,308 1080,245 1200,272 L1200,320 L0,320 Z"/>
    </path>

    <!-- Diagonal Shimmer Bling Sweep -->
    <g transform="rotate(18 600 160)">
      <rect x="-400" y="-120" width="260" height="600" fill="url(#sweepBeam)">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1750 0" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Twinkling Diamond Sparkles -->
    <g filter="url(#starGlow)">
      <g class="sA" transform="translate(135, 76)">
        <path d="M0,-14 L2.8,-2.8 L14,0 L2.8,2.8 L0,14 L-2.8,2.8 L-14,0 L-2.8,-2.8 Z" fill="#FFFFFF"/>
      </g>
      <g class="sB" transform="translate(260, 215)">
        <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#7DD3FC"/>
      </g>
      <g class="sC" transform="translate(1055, 72)">
        <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#FDE047"/>
      </g>
      <g class="sD" transform="translate(945, 220)">
        <path d="M0,-11 L2.2,-2.2 L11,0 L2.2,2.2 L0,11 L-2.2,2.2 L-11,0 L-2.2,-2.2 Z" fill="#D8B4FE"/>
      </g>
      <g class="sA" transform="translate(195, 145)">
        <path d="M0,-7 L1.5,-1.5 L7,0 L1.5,1.5 L0,7 L-1.5,1.5 L-7,0 L-1.5,-1.5 Z" fill="#FDE68A"/>
      </g>
      <g class="sC" transform="translate(1005, 152)">
        <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z" fill="#FFFFFF"/>
      </g>
      <g class="sB" transform="translate(380, 62)">
        <path d="M0,-6 L1.3,-1.3 L6,0 L1.3,1.3 L0,6 L-1.3,1.3 L-6,0 L-1.3,-1.3 Z" fill="#38BDF8"/>
      </g>
      <g class="sD" transform="translate(825, 58)">
        <path d="M0,-7 L1.5,-1.5 L7,0 L1.5,1.5 L0,7 L-1.5,1.5 L-7,0 L-1.5,-1.5 Z" fill="#F472B6"/>
      </g>
    </g>

    <!-- Drifting Sparkle Dust Dots -->
    <circle cx="95" cy="235" r="2" fill="#7DD3FC" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1115" cy="240" r="2.2" fill="#FDE047" opacity="0.7">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="265" r="1.8" fill="#FFFFFF" opacity="0.55">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="260" r="2" fill="#C084FC" opacity="0.6">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Typography -->
    <g transform="translate(600, 66)" text-anchor="middle">
      <rect x="-158" y="-16" width="316" height="26" rx="13" fill="#0F172A" fill-opacity="0.78" stroke="url(#borderBling)" stroke-width="1"/>
      <text x="0" y="1" class="tag">DUONG-DMT  //  PORTFOLIO</text>
    </g>

    <text x="600" y="156" text-anchor="middle" class="name" fill="url(#titleShine)" filter="url(#softGlow)">ĐỖ HỒNG DƯƠNG</text>

    <text x="600" y="198" text-anchor="middle" class="sub">DMT  ·  Full-Stack Web Developer  ·  Vietnam</text>

    <!-- Bottom Pill Bar -->
    <g transform="translate(600, 246)" text-anchor="middle">
      <rect x="-220" y="-17" width="440" height="32" rx="16" fill="#090D1C" fill-opacity="0.82" stroke="#334155" stroke-width="1"/>
      <circle cx="-192" cy="-1" r="4.5" fill="#38BDF8">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="8" y="4" class="meta">Next.js 15  ·  React 19  ·  TypeScript  ·  PostgreSQL</text>
    </g>
  </g>

  <!-- Holographic Neon Frame -->
  <rect x="6" y="6" width="1188" height="308" rx="22" fill="none" stroke="url(#borderBling)" stroke-width="2.2" filter="url(#softGlow)"/>
</svg>
