<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="100%" role="img" aria-label="Featured Project - DuongMTP">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="100%" stop-color="#101833"/>
    </linearGradient>

    <linearGradient id="edgeViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="glint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="c1"><rect x="6" y="6" width="1188" height="184" rx="18"/></clipPath>
  </defs>

  <style>
    .num { font: 700 11.5px 'Consolas', monospace; letter-spacing: 2.2px; }
    .title { font: 800 28px 'Segoe UI', system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.5px; }
    .desc { font: 400 14.5px 'Segoe UI', system-ui, sans-serif; fill: #94A3B8; }
    .tagTxt { font: 600 12px 'Consolas', monospace; fill: #E2E8F0; }
    .statusLbl { font: 700 11px 'Consolas', monospace; letter-spacing: 1.8px; fill: #34D399; }
    .statusUrl { font: 600 14.5px 'Consolas', monospace; fill: #F1F5F9; letter-spacing: 0.4px; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .sp1 { transform-box: fill-box; transform-origin: center; animation: sparkle 3.1s ease-in-out infinite; }
    .sp2 { transform-box: fill-box; transform-origin: center; animation: sparkle 3.6s ease-in-out 1.1s infinite; }
  </style>

  <g clip-path="url(#c1)">
    <rect x="6" y="6" width="1188" height="184" fill="url(#cBg)"/>
    <circle cx="190" cy="98" r="180" fill="url(#orbViolet)"/>
    <circle cx="1020" cy="108" r="190" fill="url(#orbMint)"/>
    <rect x="6" y="6" width="1188" height="4" fill="url(#edgeViolet)"/>

    <!-- Gliding Shimmer -->
    <g transform="rotate(16 600 98)">
      <rect x="-250" y="-80" width="200" height="360" fill="url(#glint)">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1650 0" dur="5.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Twinkling Sparkles -->
    <g class="sp1" transform="translate(1156, 38)">
      <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z" fill="#D8B4FE"/>
    </g>
    <g class="sp2" transform="translate(768, 42)">
      <path d="M0,-6.5 L1.5,-1.5 L6.5,0 L1.5,1.5 L0,6.5 L-1.5,1.5 L-6.5,0 L-1.5,-1.5 Z" fill="#7DD3FC"/>
    </g>

    <!-- Project Info -->
    <text x="42" y="46" class="num" fill="#C084FC">01  //  WEB SHOWCASE</text>
    <text x="42" y="88" class="title">DuongMTP</text>
    <text x="42" y="118" class="desc">Personal web project deployed live on duong-mtp.vercel.app with TypeScript.</text>

    <!-- Tech & Status Pills -->
    <rect x="42" y="140" width="108" height="28" rx="14" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.55"/>
    <text x="96" y="158" text-anchor="middle" class="tagTxt">TypeScript</text>

    <rect x="160" y="140" width="90" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="205" y="158" text-anchor="middle" class="tagTxt">Vercel</text>

    <rect x="260" y="140" width="104" height="28" rx="14" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="312" y="158" text-anchor="middle" class="tagTxt">Live Site</text>

    <!-- Right Deployment Badge -->
    <rect x="836" y="54" width="316" height="88" rx="14" fill="#090D1C" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
    <circle cx="864" cy="82" r="4.5" fill="#34D399">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="880" y="86" class="statusLbl">LIVE DEPLOYMENT</text>
    <text x="860" y="118" class="statusUrl">duong-mtp.vercel.app</text>
  </g>

  <rect x="6" y="6" width="1188" height="184" rx="18" fill="none" stroke="url(#edgeViolet)" stroke-opacity="0.6" stroke-width="1.6"/>
</svg>
