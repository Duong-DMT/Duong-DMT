<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 225" width="100%" role="img" aria-label="Featured Projects">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="100%" stop-color="#101833"/>
    </linearGradient>

    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="edgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <linearGradient id="edgeViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="glint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="c1"><rect x="12" y="10" width="376" height="205" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="412" y="10" width="376" height="205" rx="18"/></clipPath>
    <clipPath id="c3"><rect x="812" y="10" width="376" height="205" rx="18"/></clipPath>
  </defs>

  <style>
    .num { font: 700 11px 'Consolas', monospace; letter-spacing: 2.2px; }
    .title { font: 800 22px 'Segoe UI', system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
    .desc { font: 400 13.5px 'Segoe UI', system-ui, sans-serif; fill: #94A3B8; }
    .tagTxt { font: 600 11.5px 'Consolas', monospace; fill: #E2E8F0; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .sp1 { transform-box: fill-box; transform-origin: center; animation: sparkle 3.1s ease-in-out infinite; }
    .sp2 { transform-box: fill-box; transform-origin: center; animation: sparkle 3.6s ease-in-out 0.9s infinite; }
    .sp3 { transform-box: fill-box; transform-origin: center; animation: sparkle 2.9s ease-in-out 1.7s infinite; }
  </style>

  <!-- Card 1: Aurora Hotel -->
  <g clip-path="url(#c1)">
    <rect x="12" y="10" width="376" height="205" fill="url(#cBg)"/>
    <rect x="12" y="10" width="376" height="4" fill="url(#edgeCyan)"/>
    <g transform="rotate(20 200 112)">
      <rect x="-120" y="-40" width="140" height="320" fill="url(#glint)">
        <animateTransform attributeName="transform" type="translate" from="-100 0" to="550 0" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g class="sp1" transform="translate(352, 42)">
      <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z" fill="#7DD3FC"/>
    </g>
    <text x="36" y="46" class="num" fill="#38BDF8">01  //  RESERVATION SYSTEM</text>
    <text x="36" y="84" class="title">Aurora Hotel</text>
    <text x="36" y="116" class="desc">Boutique luxury hotel reservation system</text>
    <text x="36" y="136" class="desc">with Next.js 15, React 19 &amp; Neon PostgreSQL.</text>
    <rect x="36" y="164" width="102" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="87" y="181" text-anchor="middle" class="tagTxt">Next.js 15</text>
    <rect x="148" y="164" width="106" height="26" rx="13" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="201" y="181" text-anchor="middle" class="tagTxt">TypeScript</text>
    <rect x="264" y="164" width="96" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="312" y="181" text-anchor="middle" class="tagTxt">Auth.js v5</text>
  </g>
  <rect x="12" y="10" width="376" height="205" rx="18" fill="none" stroke="url(#edgeCyan)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Card 2: Ph4rmacyVN -->
  <g clip-path="url(#c2)">
    <rect x="412" y="10" width="376" height="205" fill="url(#cBg)"/>
    <rect x="412" y="10" width="376" height="4" fill="url(#edgeGold)"/>
    <g transform="rotate(20 600 112)">
      <rect x="280" y="-40" width="140" height="320" fill="url(#glint)">
        <animateTransform attributeName="transform" type="translate" from="-100 0" to="550 0" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g class="sp2" transform="translate(752, 42)">
      <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z" fill="#FDE047"/>
    </g>
    <text x="436" y="46" class="num" fill="#FDE047">02  //  E-COMMERCE PLATFORM</text>
    <text x="436" y="84" class="title">Ph4rmacyVN</text>
    <text x="436" y="116" class="desc">Online pharmacy management &amp; store</text>
    <text x="436" y="136" class="desc">powered by Prisma, Neon DB &amp; Auth.js v5.</text>
    <rect x="436" y="164" width="102" height="26" rx="13" fill="#0F172A" stroke="#FDE047" stroke-opacity="0.5"/>
    <text x="487" y="181" text-anchor="middle" class="tagTxt">Next.js 15</text>
    <rect x="548" y="164" width="84" height="26" rx="13" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.5"/>
    <text x="590" y="181" text-anchor="middle" class="tagTxt">Prisma</text>
    <rect x="642" y="164" width="114" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="699" y="181" text-anchor="middle" class="tagTxt">PostgreSQL</text>
  </g>
  <rect x="412" y="10" width="376" height="205" rx="18" fill="none" stroke="url(#edgeGold)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Card 3: DuongMTP -->
  <g clip-path="url(#c3)">
    <rect x="812" y="10" width="376" height="205" fill="url(#cBg)"/>
    <rect x="812" y="10" width="376" height="4" fill="url(#edgeViolet)"/>
    <g transform="rotate(20 1000 112)">
      <rect x="680" y="-40" width="140" height="320" fill="url(#glint)">
        <animateTransform attributeName="transform" type="translate" from="-100 0" to="550 0" dur="5.2s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g class="sp3" transform="translate(1152, 42)">
      <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z" fill="#D8B4FE"/>
    </g>
    <text x="836" y="46" class="num" fill="#C084FC">03  //  WEB SHOWCASE</text>
    <text x="836" y="84" class="title">DuongMTP</text>
    <text x="836" y="116" class="desc">Personal web project deployed live on</text>
    <text x="836" y="136" class="desc">duong-mtp.vercel.app with TypeScript.</text>
    <rect x="836" y="164" width="106" height="26" rx="13" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.5"/>
    <text x="889" y="181" text-anchor="middle" class="tagTxt">TypeScript</text>
    <rect x="952" y="164" width="102" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="1003" y="181" text-anchor="middle" class="tagTxt">Live Site</text>
  </g>
  <rect x="812" y="10" width="376" height="205" rx="18" fill="none" stroke="url(#edgeViolet)" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
